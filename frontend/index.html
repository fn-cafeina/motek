<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Motek</title>
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161b22" media="(prefers-color-scheme: dark)" />
    <script>
      // Aplica el tema guardado antes del primer paint para que no haya destello.
      ;(function () {
        try {
          var stored = localStorage.getItem("motek_theme")
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) document.documentElement.classList.add("dark")
        } catch (e) {
          // Sin localStorage (modo privado) se usa el tema del sistema en CSS.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
